version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: growthdesk-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: growthdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: growthdesk-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: growthdesk-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/growthdesk
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=growthdesk-production-secret-key-change-in-prod
      - ENCRYPTION_KEY=GDYPbCUrkW2NY8ikqDSyr2dNcgDKUb2AQLzHrQiQFd4=
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: growthdesk-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/growthdesk
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=growthdesk-production-secret-key-change-in-prod
      - ENCRYPTION_KEY=GDYPbCUrkW2NY8ikqDSyr2dNcgDKUb2AQLzHrQiQFd4=
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: growthdesk-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:

